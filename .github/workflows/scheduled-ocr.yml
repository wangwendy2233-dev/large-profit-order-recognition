name: Scheduled OCR

on:
  schedule:
    # Beijing 00:23 / 06:23 / 12:23 / 18:23 (UTC+8). Minute 23 avoids GitHub :00-:10 skips.
    - cron: "23 16 * * *"
    - cron: "23 22 * * *"
    - cron: "23 4 * * *"
    - cron: "23 10 * * *"
  workflow_dispatch:

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --registry https://registry.npmjs.org --no-package-lock
      - name: Run hourly OCR
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: node run-hourly.js
